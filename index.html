<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="logos/DPCL.jpeg">
    <link rel="apple-touch-icon" href="logos/DPCL.jpeg">
    <title>Summer 2026 Schedule - DPCL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.3) 100%), url('logos/summer-banner.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            padding: 50px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #ffb700;
        }

        .league-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
            display: block;
            background-color: transparent;
            border-radius: 50%;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            visibility: hidden;
        }

        header h1 {
            font-size: 3.5em;
            margin-bottom: 12px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.3em;
            opacity: 1;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 900;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            transform: scale(1.05);
        }

        .nav-btn:not(.active) {
            background-color: white;
            color: #ff6b35;
            border: 3px solid #ff6b35;
            font-weight: 900;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: center;
            background: linear-gradient(135deg, #2a2a4e 0%, #1a1a3a 100%);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            border: 3px solid #00d4ff;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-group label {
            font-weight: 900;
            color: #00d4ff;
            white-space: nowrap;
            font-size: 1.2em;
            text-transform: uppercase;
        }

        .week-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .week-btn {
            padding: 12px 18px;
            border: 3px solid #ffb700;
            background-color: white;
            color: #ff6b35;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            transition: all 0.3s ease;
            min-width: 50px;
            text-align: center;
            font-size: 1em;
            text-transform: uppercase;
        }

        .week-btn.active {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
            border-color: #ffb700;
        }

        .week-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .division-buttons {
            display: flex;
            gap: 15px;
        }

        .division-btn {
            padding: 12px 25px;
            border: 3px solid #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            transition: all 0.3s ease;
            background-color: white;
            color: #0099cc;
            font-size: 1em;
            text-transform: uppercase;
        }

        .division-btn.active {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }

        .division-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        .division-header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 900;
            margin-top: 30px;
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
            border: 3px solid #ffb700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-card {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: 4px solid #ffb700;
            padding: 0;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .match-card:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            transform: translateY(-5px);
            border-color: #ff6b35;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 25px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            font-weight: 900;
            font-size: 1.2em;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 4px solid #ffb700;
            text-transform: uppercase;
        }

        .match-header-left {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 1.1em;
        }

        .match-header-date {
            background-color: rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 900;
            border: 2px solid white;
        }

        .match-details {
            padding: 18px 25px;
            background-color: rgba(255, 255, 255, 0.95);
            border-bottom: 3px solid #ffb700;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            font-size: 1.1em;
            color: #ff6b35;
            font-weight: bold;
        }

        .match-info-item {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 1.05em;
            color: #333;
            padding: 0;
            font-weight: 900;
        }

        .match-info-icon {
            font-weight: bold;
            font-size: 1.4em;
        }

        .match-teams {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 0;
            background: white;
            position: relative;
        }

        .team {
            flex: 1;
            text-align: center;
            padding: 20px 15px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .team:first-child {
            border-right: 4px solid #ffb700;
            padding-right: 40px;
        }

        .team:last-child {
            border-left: 4px solid #ffb700;
            padding-left: 40px;
        }

        .team-name {
            font-weight: 900;
            font-size: 0.85em;
            color: #ff6b35;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-score-placeholder {
            font-size: 0.9em;
            color: #0099cc;
            margin-top: 8px;
            font-weight: bold;
        }

        .team-logo {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 10px;
            display: block;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            border: 3px solid #ffb700;
        }

        .vs {
            font-weight: 900;
            color: white;
            font-size: 1.8em;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffb700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .no-matches {
            background: linear-gradient(135deg, #2a2a4e 0%, #1a1a3a 100%);
            border: 4px solid #00d4ff;
            padding: 50px 30px;
            border-radius: 12px;
            text-align: center;
            color: #00d4ff;
            font-size: 1.3em;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #00d4ff;
            margin-top: 50px;
            font-size: 1.05em;
            font-weight: bold;
        }

        #matches-container {
            min-height: 200px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5em;
            }

            header p {
                font-size: 1.1em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
            }

            .control-group {
                flex-direction: column;
            }

            .week-buttons {
                gap: 8px;
            }

            .week-btn {
                padding: 10px 12px;
                font-size: 0.9em;
                min-width: 45px;
            }

            .division-buttons {
                justify-content: center;
            }

            .match-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .match-header-left {
                flex-direction: row;
                font-size: 1em;
            }

            .match-details {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
            }

            .match-teams {
                flex-direction: column;
                gap: 0;
            }

            .team {
                padding: 15px 10px;
                border-right: none;
                border-bottom: 3px solid #ffb700;
                position: relative;
            }

            .team:first-child {
                border-right: none;
                border-bottom: 3px solid #ffb700;
                padding-right: 10px;
            }

            .team:last-child {
                border-bottom: none;
                border-left: none;
                padding-left: 10px;
            }

            .team-logo {
                width: 110px;
                height: 110px;
                padding: 8px;
            }

            .team-name {
                font-size: 0.75em;
            }

            .vs {
                position: static;
                transform: none;
                margin: 12px 0;
                align-self: center;
                flex-shrink: 0;
            }

            .team-name {
                font-size: 1.2em;
            }

            .division-header {
                font-size: 1.4em;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logos/DPCL.jpeg" alt="DPCL Logo" class="league-logo">
            <h1>🏆 DPCL SUMMER 2026 🏆</h1>
            <p>TWO DIVISIONS • JULY - AUGUST • 7 WEEKS • 14 TEAMS</p>
        </header>

        <div class="nav-buttons">
            <button class="nav-btn" onclick="location.href='spring-schedule.html'">📅 SPRING 2026</button>
            <button class="nav-btn active">☀️ SUMMER 2026</button>
            <button class="nav-btn" onclick="window.open('https://photos.app.goo.gl/HZZcPQoqzLz3ScNb6', '_blank')">📸 FLASHBACK</button>
            <button class="nav-btn" onclick="location.href='admin.html'">⚙️ ADMIN</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>SELECT WEEK:</label>
                <div class="week-buttons" id="week-buttons"></div>
            </div>
            <div class="control-group division-buttons" id="division-buttons"></div>
            <div class="control-group">
                <label>YOUR TEAM:</label>
                <select id="team-select" style="padding: 12px 15px; border: 3px solid #ffb700; border-radius: 8px; background-color: white; color: #ff6b35; font-weight: 900; cursor: pointer; font-size: 1em; text-transform: uppercase;">
                    <option value="all">All Teams</option>
                </select>
            </div>
        </div>

        <div id="matches-container"></div>

        <footer>
            <p>DPCL SUMMER 2026 SEASON • JULY - AUGUST 2026 • MATCHES AT FM / BAKERSFIELD OR KRUM FIELDS</p>
        </footer>
    </div>

    <script>
        let scheduleData = null;
        let currentWeek = 1;
        let currentDivision = 'A';
        let currentTeam = 'all';

        // Team logo mapping
        const teamLogos = {
            'Avengers': 'logos/teams/AVENGERS LOGO.jpg',
            'Devils': 'logos/teams/DEvils.jpg',
            'Fighters': 'logos/teams/Fighers.jpeg',
            'India Blues': 'logos/teams/Blues.jpeg',
            'Dragons': 'logos/teams/Dragons.jpeg',
            'Eagles': 'logos/teams/Eagles.jpg',
            'Royal Lions': 'logos/teams/Royal Lions.jpg',
            'Mavericks': 'logos/teams/Mavs.jpeg',
            'Warriors': 'logos/teams/Warriors.jpeg',
            'Guts and Glory': 'logos/teams/GG.jpeg',
            'Ekadash XI': 'logos/teams/EkadashXI.png',
            'Impact XI': 'logos/teams/ImpactXI.jpeg',
            'Flower Mound CC': 'logos/teams/FMCC.jpg',
            'Super Chargers XI': 'logos/teams/SuperChargersXI.png'
        };

        // Team captains and vice-captains
        const teamInfo = {
            'Mavericks': { captain: 'Karthik', vc: 'Vamsi' },
            'Fighters': { captain: 'Ajay', vc: 'Krishna' },
            'Eagles': { captain: 'Naresh', vc: 'Rahul' },
            'Devils': { captain: 'Srikanth', vc: 'Veeru' },
            'India Blues': { captain: 'Pratap', vc: 'Avinash' },
            'Warriors': { captain: 'Srikanth', vc: 'Guna' },
            'Dragons': { captain: 'Sridhar', vc: 'Kishore' },
            'Royal Lions': { captain: 'Abhilash', vc: 'Praveen' },
            'Guts and Glory': { captain: 'Dipesh', vc: 'Swapnil' },
            'Impact XI': { captain: 'Manideep', vc: 'Jaswarith' },
            'Flower Mound CC': { captain: 'Abbas', vc: 'Shahid' },
            'Avengers': { captain: 'Varun', vc: 'Santosh' },
            'Ekadash XI': { captain: 'Phanindra', vc: 'Phani T' },
            'Super Chargers XI': { captain: 'Satish', vc: 'Santosh' }
        };

        async function loadSchedule() {
            try {
                const response = await fetch('schedule-summer.json');
                scheduleData = await response.json();
                initializeUI();
                displayMatches();
            } catch (error) {
                console.error('Error loading schedule:', error);
                document.getElementById('matches-container').innerHTML = '<div class="no-matches">ERROR LOADING SCHEDULE. PLEASE REFRESH THE PAGE.</div>';
            }
        }

        function initializeUI() {
            // Create week buttons
            const weekButtonsContainer = document.getElementById('week-buttons');
            weekButtonsContainer.innerHTML = '';
            for (let i = 1; i <= scheduleData.totalWeeks; i++) {
                const btn = document.createElement('button');
                btn.className = `week-btn ${i === 1 ? 'active' : ''}`;
                btn.textContent = `W${i}`;
                btn.onclick = () => selectWeek(i);
                weekButtonsContainer.appendChild(btn);
            }

            // Create division buttons
            const divisionButtonsContainer = document.getElementById('division-buttons');
            divisionButtonsContainer.innerHTML = '';
            ['A', 'B'].forEach(div => {
                const btn = document.createElement('button');
                btn.className = `division-btn ${div === 'A' ? 'active' : ''}`;
                btn.textContent = `DIVISION ${div}`;
                btn.onclick = () => selectDivision(div);
                divisionButtonsContainer.appendChild(btn);
            });

            // Populate team dropdown
            const allTeams = [...new Set(scheduleData.matches.flatMap(m => [m.team1, m.team2]))].sort();
            const teamSelect = document.getElementById('team-select');
            allTeams.forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamSelect.appendChild(option);
            });
            teamSelect.addEventListener('change', (e) => selectTeam(e.target.value));
        }

        function selectWeek(week) {
            currentWeek = week;
            document.querySelectorAll('.week-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === week);
            });
            displayMatches();
        }

        function selectDivision(division) {
            currentDivision = division;
            document.querySelectorAll('.division-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(division));
            });
            displayMatches();
        }

        function selectTeam(team) {
            currentTeam = team;
            displayMatches();
        }

        function displayMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            // If team is selected, show all their games
            if (currentTeam !== 'all') {
                const teamMatches = scheduleData.matches.filter(m => m.team1 === currentTeam || m.team2 === currentTeam).sort((a, b) => a.week - b.week);
                
                if (teamMatches.length === 0) {
                    container.innerHTML = '<div class="no-matches">NO MATCHES FOUND FOR ' + currentTeam.toUpperCase() + '</div>';
                    return;
                }

                // Group by week
                const byWeek = {};
                teamMatches.forEach(match => {
                    if (!byWeek[match.week]) byWeek[match.week] = [];
                    byWeek[match.week].push(match);
                });

                Object.keys(byWeek).sort((a, b) => a - b).forEach(week => {
                    container.innerHTML += `<div class="division-header">WEEK ${week}</div>`;
                    byWeek[week].forEach(match => {
                        container.innerHTML += createMatchCard(match);
                    });
                });
                return;
            }

            // Default view: filter by week and division
            const weekMatches = scheduleData.matches.filter(m => m.week === currentWeek);
            
            if (weekMatches.length === 0) {
                container.innerHTML = '<div class="no-matches">NO MATCHES SCHEDULED FOR WEEK ' + currentWeek + '</div>';
                return;
            }

            // Filter by current division then get other division
            const divisionMatches = weekMatches.filter(m => m.division === currentDivision);
            const otherDivisionMatches = weekMatches.filter(m => m.division !== currentDivision);

            if (divisionMatches.length === 0) {
                container.innerHTML = '<div class="no-matches">NO MATCHES FOR DIVISION ' + currentDivision + ' IN WEEK ' + currentWeek + '</div>';
                return;
            }

            // Display current division
            container.innerHTML += `<div class="division-header">DIVISION ${currentDivision} • WEEK ${currentWeek}</div>`;
            divisionMatches.forEach(match => {
                container.innerHTML += createMatchCard(match);
            });

            // Display other division
            if (otherDivisionMatches.length > 0) {
                container.innerHTML += `<div class="division-header">DIVISION ${currentDivision === 'A' ? 'B' : 'A'} • WEEK ${currentWeek}</div>`;
                otherDivisionMatches.forEach(match => {
                    container.innerHTML += createMatchCard(match);
                });
            }
        }

        function createMatchCard(match) {
            const logo1 = teamLogos[match.team1] ? `<img src="${teamLogos[match.team1]}" alt="${match.team1}" class="team-logo">` : '';
            const logo2 = teamLogos[match.team2] ? `<img src="${teamLogos[match.team2]}" alt="${match.team2}" class="team-logo">` : '';
            
            const team1Info = teamInfo[match.team1] || { captain: 'TBD', vc: 'TBD' };
            const team2Info = teamInfo[match.team2] || { captain: 'TBD', vc: 'TBD' };
            
            return `
                <div class="match-card">
                    <div class="match-header">
                        <div class="match-header-left">
                            <strong>Week ${match.week}</strong>
                            <span>•</span>
                            <strong>${match.day.toUpperCase()}</strong>
                        </div>
                        <div class="match-header-date">${match.date}</div>
                    </div>
                    <div class="match-details">
                        <div class="match-info-item">
                            <span class="match-info-icon">📍</span>
                            <span><strong>${match.venue}</strong></span>
                        </div>
                        <div class="match-info-item">
                            <span class="match-info-icon">🕕</span>
                            <span><strong>${match.time}</strong></span>
                        </div>
                    </div>
                    <div class="match-teams">
                        <div class="team">
                            ${logo1}
                            <div class="team-name">${match.team1}</div>
                            <div style="font-size: 0.8em; margin-top: 10px; line-height: 1.4;">
                                <div style="color: #ff6b35; font-weight: 900;">⭐ ${team1Info.captain}</div>
                                <div style="color: #0099cc; font-weight: 700; font-size: 0.9em;">(VC: ${team1Info.vc})</div>
                            </div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            ${logo2}
                            <div class="team-name">${match.team2}</div>
                            <div style="font-size: 0.8em; margin-top: 10px; line-height: 1.4;">
                                <div style="color: #ff6b35; font-weight: 900;">⭐ ${team2Info.captain}</div>
                                <div style="color: #0099cc; font-weight: 700; font-size: 0.9em;">(VC: ${team2Info.vc})</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Load schedule on page load
        window.addEventListener('DOMContentLoaded', loadSchedule);
    </script>
</body>
</html>
